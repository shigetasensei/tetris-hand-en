<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracking Tetris</title>
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <div class="tetris-section">
                <canvas id="tetris-canvas" width="300" height="600"></canvas>
                <div class="game-info">
                    <div class="score">Score: <span id="score">0</span></div>
                    <div class="lines">Lines: <span id="lines">0</span></div>
                </div>
            </div>
            <div class="camera-section">
                <video id="camera-video" autoplay></video>
                <canvas id="camera-canvas"></canvas>
                <div class="gesture-info">
                    <div class="gesture-status">
                        Hand detection: <span id="hand-status">Waiting</span>
                    </div>
                    <div class="gesture-type">
                        Gesture: <span id="gesture-type">-</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button id="start-btn">Start</button>
            <button id="pause-btn" disabled>Pause</button>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
