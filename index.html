<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Tracking Tetris</title>
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <div class="tetris-section">
                <canvas id="tetris-canvas" width="300" height="600"></canvas>
                <div class="game-info">
                    <div class="score">Score: <span id="score">0</span></div>
                    <div class="lines">Lines: <span id="lines">0</span></div>
                </div>
            </div>
            <div class="camera-section">
                <video id="camera-video" autoplay muted playsinline></video>
                <canvas id="camera-canvas"></canvas>
                <div class="gesture-info">
                    <div class="gesture-status">
                        Tracking: <span id="hand-status">Waiting</span>
                    </div>
                    <div class="gesture-type">
                        Gesture: <span id="gesture-type">-</span>
                    </div>
                </div>
                <div class="settings-panel">
                    <h3>Tracking Settings</h3>
                    <div class="setting-grid">
                        <div class="setting-item">
                            <label for="tracking-mode">Tracking mode</label>
                            <select id="tracking-mode">
                                <option value="hand">Hand</option>
                                <option value="body">Full body</option>
                                <option value="eyes">Eyes only</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label for="control-profile">Control profile</label>
                            <select id="control-profile">
                                <option value="standard">Standard controls</option>
                                <option value="custom">Custom poses</option>
                            </select>
                        </div>
                    </div>
                    <p id="mode-help" class="mode-help"></p>
                    <div id="eye-control-settings" class="setting-item" hidden>
                        <label for="eye-control-style">Eye action style</label>
                        <select id="eye-control-style">
                            <option value="accessible">No wink required</option>
                            <option value="wink">Wink controls</option>
                        </select>
                    </div>
                    <div id="eye-calibration" class="setting-actions" hidden>
                        <button type="button" id="calibrate-eyes-btn" class="secondary-btn">Calibrate center gaze</button>
                        <span id="eye-calibration-status" class="inline-status" aria-live="polite"></span>
                    </div>
                    <div id="pose-registration" class="pose-registration" hidden>
                        <h4>Custom command pose</h4>
                        <p>Hold one pose until recording completes.</p>
                        <div class="registration-controls">
                            <select id="pose-command" aria-label="Command to register">
                                <option value="left">Move left</option>
                                <option value="right">Move right</option>
                                <option value="down">Hard drop</option>
                                <option value="rotate">Rotate</option>
                            </select>
                            <button type="button" id="record-pose-btn">Record pose</button>
                            <button type="button" id="reset-poses-btn" class="danger-btn">Reset</button>
                        </div>
                        <div class="recording-progress" aria-live="polite">
                            <div id="recording-progress-bar"></div>
                        </div>
                        <p id="registration-status">No custom poses registered.</p>
                    </div>
                    <details class="debug-panel">
                        <summary>Tracking debug</summary>
                        <pre id="tracking-debug">Waiting for camera...</pre>
                    </details>
                </div>
            </div>
        </div>
        <div class="controls">
            <button id="start-btn">Start</button>
            <button id="pause-btn" disabled>Pause</button>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
